  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/splash-minister.jpg" alt="Patiala Rural" />
    </div>
    <div id="root"></div>
    <script>
      window.__hideAppSplash = function () {
        var el = document.getElementById("app-splash");
        if (!el) return;
        el.classList.add("hide");
        setTimeout(function () { el.remove(); }, 400);
      };
      // Fallback if app takes too long
      setTimeout(function () { window.__hideAppSplash && window.__hideAppSplash(); }, 4000);
    </script>
